<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepper Shakers | Apex Legends Esports Team</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- 🔗 NEW: External CSS -->
    <link rel="stylesheet" href="static/styles.css">

    {% if login_error %}
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const logo = document.getElementById('team-logo');
                logo.style.animation = 'fadeIn 0.8s ease-out forwards';
            });
        </script>
    {% endif %}
</head>
<body>
    <main class="app-container">

        <!-- Branding -->
        <div class="logo" id="team-logo">
            <img src="static/images/branding/Stacked Logo/Icons/PNG files/icon - 2.png" alt="Pepper Shakers Logo">
        </div>
        <h1>Pepper Shakers</h1>
        <p class="tagline">Apex Legends | Team Portal</p>

        <!-- Error Message Placeholder -->
        {% if login_error %}
            <div class="message">{{ login_error }}</div>
        {% endif %}

        <!-- ═══ 6 BUTTON NAVIGATION HUB (2x3 Grid) ═══ -->
        <div class="menu-button-grid">
            <a href="{{ url_for('home') }}" class="{% if current_page == 'home' %}active{% endif %} nav-btn">Login</a>
            <a href="{{ url_for('dashboard') }}" class="{% if current_page == 'dashboard' %}active{% endif %} nav-btn">Dashboard</a>
            <a href="{{ url_for('lootpaths') }}" class="{% if current_page == 'lootpaths' %}active{% endif %} nav-btn">Loot Paths</a>
            <a href="{{ url_for('team_comps') }}" class="{% if current_page == 'team_comps' %}active{% endif %} nav-btn">Team Comps</a>
            <a href="{{ url_for('map_data') }}" class="{% if current_page == 'map_data' %}active{% endif %} nav-btn">Map Data</a>
            <a href="{{ url_for('gun_data') }}" class="{% if current_page == 'gun_data' %}active{% endif %} nav-btn">Gun Data</a>
        </div>

        <!-- Footer -->
        <p class="footer">Internal Use Only • EST. 2026</p>

    </main>

    <!-- Inline JS/CSS (mirrored from your original) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Random messages to rotate through
            const funnyMessages = [
                'Login'
            ];

            // Apply to the first button (Login)
            const loginBtn = document.querySelector('.nav-btn');
            loginBtn.textContent = funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
            
            // Optional: subtle pulse effect on load so users notice the change
            loginBtn.style.animation = 'buttonPulse 0.6s ease-out forwards';
        });
    </script>

    <style>
        @keyframes buttonPulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.03); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
